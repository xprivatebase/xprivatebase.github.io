<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#090909">
  <title>お問い合わせありがとうございます | PRIVATE BASE</title>
  <style>
    :root{color-scheme:dark;--red:#e33331;--text:#f2f0ed;--muted:#bfb8b5}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;isolation:isolate;background:#090909;color:var(--text);font-family:Arial,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;line-height:1.8}
    .scene{position:fixed;inset:0;z-index:-2;overflow:hidden;background:#11141a}
    .scene::before{content:"";position:absolute;inset:0;background:url("tower-lounge.png") 86% 36%/cover no-repeat;filter:brightness(.66) saturate(.56)}
    .scene::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,8,9,.97),rgba(8,8,9,.87) 45%,rgba(8,8,9,.32)),linear-gradient(0deg,#090909 1%,transparent 65%)}
    a{color:inherit;text-decoration:none;touch-action:manipulation}
    a:focus-visible{outline:2px solid #fff;outline-offset:6px}
    .header{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:96px;padding:24px max(36px,calc((100vw - 1180px)/2));border-bottom:1px solid #ffffff1c}
    .brand{display:inline-flex;align-items:center;gap:5px;font-size:24px;font-weight:900;letter-spacing:-.9px;line-height:1;white-space:nowrap}
    .brand span{font-weight:400}
    .brand i{width:7px;height:7px;margin:12px 0 0 3px;background:var(--red)}
    .header-note{font-size:10px;letter-spacing:.2em;color:#b9b0ae}
    main{width:min(1180px,calc(100% - 72px));margin:auto;flex:1;display:flex;align-items:center;padding:72px 0 82px}
    .message{width:100%;max-width:710px;padding-left:30px;border-left:1px solid #ffffff26;position:relative}
    .message::before{content:"";position:absolute;top:0;left:-1px;width:2px;height:58px;background:var(--red)}
    .eyebrow{display:flex;align-items:center;gap:12px;margin:0 0 30px;color:#f56b67;font-size:11px;font-weight:700;letter-spacing:.19em}
    .check{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;width:28px;height:28px;border:1px solid #e3333180;border-radius:50%}
    .check svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8}
    h1{margin:0 0 32px;font-size:clamp(28px,3.2vw,44px);font-weight:700;line-height:1.65;letter-spacing:.035em}
    h1 span{display:block}
    .reply{max-width:570px;margin:0;color:#e1dcd9;font-size:16px;line-height:2.15}
    .reply + .reply{margin-top:8px}
    .notice{display:flex;gap:12px;align-items:flex-start;max-width:530px;margin:32px 0 36px;padding:16px 18px;border:1px solid #ffffff1b;background:#0c0b0cd9;color:var(--muted);font-size:13px;line-height:1.9}
    .notice svg{width:19px;height:19px;flex-shrink:0;margin-top:3px;fill:none;stroke:#d8bcab;stroke-width:1.4}
    .notice p{margin:0}
    .button{display:inline-flex;align-items:center;justify-content:space-between;gap:48px;min-height:58px;padding:15px 24px;background:var(--red);color:#fff;font-size:14px;transition:background .2s}
    .button:hover{background:#bc2927}
    .button svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.4}
    .footer{width:min(1180px,calc(100% - 72px));margin:0 auto;padding:22px 0 26px;border-top:1px solid #ffffff1c;display:flex;justify-content:space-between;gap:20px;color:#a49b98;font-size:10px;letter-spacing:.11em}
    .footer p{margin:0}
    @media(min-width:1000px){.scene::before{left:10%;background-position:right 38%;background-size:auto 120%}}
    @media(max-width:600px){
      .header{min-height:76px;padding:22px 22px}.brand{font-size:21px}.header-note{font-size:8px;letter-spacing:.12em}
      main{width:calc(100% - 44px);padding:56px 0 54px}.message{padding-left:18px}.eyebrow{font-size:10px;margin-bottom:24px;gap:9px;letter-spacing:.14em}
      h1{font-size:clamp(24px,6.4vw,32px);line-height:1.65;letter-spacing:0;margin-bottom:26px}
      .reply{font-size:15px;line-height:2}.notice{margin:26px 0 30px;padding:14px 13px;font-size:12px;gap:10px}.button{width:100%;padding:15px 19px}
      .scene::before{background-position:90% center;background-size:auto 130%}
      .scene::after{background:linear-gradient(90deg,#080809f0,#080809ba),linear-gradient(0deg,#090909,transparent 75%)}
      .footer{width:calc(100% - 44px);font-size:9px;letter-spacing:.04em;flex-wrap:wrap;gap:6px;padding:20px 0}
    }
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true"></div>
  <header class="header">
    <a class="brand" href="index.html" aria-label="PRIVATE BASE トップページ">PRIVATE <span>BASE</span><i aria-hidden="true"></i></a>
    <span class="header-note">INVITATION ONLY</span>
  </header>
  <main>
    <section class="message" aria-labelledby="thank-you-title">
      <p class="eyebrow"><span class="check" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="m4 10 4 4 8-8"/></svg></span>THANK YOU FOR YOUR MESSAGE</p>
      <h1 id="thank-you-title"><span>お問い合わせ</span><span>ありがとうございます。</span></h1>
      <p class="reply">ご登録いただいたメールアドレス宛に、<br>担当者よりご連絡いたします。</p>
      <p class="reply">ご案内まで、今しばらくお待ちください。<br>メールが届きましたら、内容をご確認ください。</p>
      <div class="notice">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="m3 6 9 7 9-7"/></svg>
        <p>メールが迷惑メールフォルダに振り分けられる場合があります。そちらもあわせてご確認ください。</p>
      </div>
      <a class="button" href="index.html">トップページに戻る<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></a>
    </section>
  </main>
  <footer class="footer"><p>A PRIVATE PLACE. NEW CONNECTIONS.</p><p>&copy; PRIVATE BASE</p></footer>
</body>
</html>
